name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "0.1.0-dev.$env:GITHUB_RUN_NUMBER" }
          "PM_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "Version: $v"

      # No generator pinned: uses the runner's default Visual Studio, x64
      - name: Configure core
        run: cmake -S core -B core/build -A x64

      - name: Build core
        run: cmake --build core/build --config Release

      # Config parsing, snapshot journal, state dir ACL, registry allowlist.
      # Makes no system changes.
      - name: Self-test
        shell: pwsh
        run: |
          core/build/Release/peakmode_test.exe selftest config/peakmode.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:PM_VERSION -CoreDll core/build/Release/PeakModeCore.dll

      - uses: actions/upload-artifact@v4
        with:
          name: PeakMode-${{ env.PM_VERSION }}-win-x64
          path: dist/PeakMode-${{ env.PM_VERSION }}-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "PeakMode $GITHUB_REF_NAME" \
            --generate-notes
